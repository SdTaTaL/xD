<title>Ilha Voxel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--sky:#9fd3f0;--ui:rgba(20,30,40,.45);--fg:#fff;color-scheme:light}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{background:var(--sky);color:var(--fg);font-family:system-ui,sans-serif}
canvas#c{display:block;width:100%;height:100%}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:var(--ui);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.8)}
#jump{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:90px;height:90px;border-radius:50%;background:var(--ui);border:2px solid rgba(255,255,255,.4);color:var(--fg);font-size:16px;font-weight:700}
#help{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ui);padding:8px 14px;border-radius:10px;font-size:13px;text-align:center;max-width:90vw}
#score{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));background:var(--ui);padding:8px 12px;border-radius:10px;font-weight:700}
</style>
<canvas id="c"></canvas>
<div id="help">Joystick à esquerda para andar · arrasta o ecrã para olhar · apanha as estrelas ⭐ (PC: WASD + rato + espaço)</div>
<div id="score">⭐ 0 / 12</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">SALTAR</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0x9fd3f0);S.fog=new THREE.Fog(0x9fd3f0,40,110);
const cam=new THREE.PerspectiveCamera(65,1,.1,300);
S.add(new THREE.HemisphereLight(0xffffff,0x557744,.7));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(30,50,20);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60});sun.shadow.mapSize.set(2048,2048);S.add(sun);

// terreno
function h(x,z){return Math.sin(x*.08)*3+Math.cos(z*.07)*3+Math.sin((x+z)*.05)*2-Math.max(0,Math.hypot(x,z)-45)*.6}
const g=new THREE.PlaneGeometry(140,140,120,120);g.rotateX(-Math.PI/2);
const p=g.attributes.position,cols=[];
for(let i=0;i<p.count;i++){const y=h(p.getX(i),p.getZ(i));p.setY(i,y);
 const c=y<-1.5?[.85,.8,.55]:y>4?[.55,.55,.5]:[.35,.65,.3];cols.push(...c)}
g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));g.computeVertexNormals();
const ground=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));ground.receiveShadow=true;S.add(ground);
const water=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x2f7fc0,transparent:true,opacity:.8}));
water.rotation.x=-Math.PI/2;water.position.y=-2;S.add(water);

// árvores e pedras
const trunkM=new THREE.MeshLambertMaterial({color:0x7a5230}),leafM=new THREE.MeshLambertMaterial({color:0x2e8b3a});
for(let i=0;i<90;i++){const x=(Math.random()-.5)*90,z=(Math.random()-.5)*90,y=h(x,z);if(y<-1||Math.hypot(x,z)<5)continue;
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,2),trunkM);t.position.set(x,y+1,z);t.castShadow=true;S.add(t);
 const l=new THREE.Mesh(new THREE.ConeGeometry(1.6,3.5,7),leafM);l.position.set(x,y+3.5,z);l.castShadow=true;S.add(l)}
const rockM=new THREE.MeshLambertMaterial({color:0x888888});
for(let i=0;i<30;i++){const x=(Math.random()-.5)*90,z=(Math.random()-.5)*90;
 const r=new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random()*.8+.4),rockM);r.position.set(x,h(x,z),z);r.castShadow=true;S.add(r)}
// nuvens
const cloudM=new THREE.MeshLambertMaterial({color:0xffffff}),clouds=[];
for(let i=0;i<14;i++){const c=new THREE.Group();for(let j=0;j<4;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*2,8,8),cloudM);s.position.set(j*2.5,Math.random(),Math.random()*2);c.add(s)}
 c.position.set((Math.random()-.5)*160,25+Math.random()*8,(Math.random()-.5)*160);S.add(c);clouds.push(c)}
// estrelas
const starM=new THREE.MeshLambertMaterial({color:0xffd700,emissive:0x664400}),stars=[];
for(let i=0;i<12;i++){const a=i/12*Math.PI*2,d=10+Math.random()*28,x=Math.cos(a)*d,z=Math.sin(a)*d;
 const s=new THREE.Mesh(new THREE.OctahedronGeometry(.7),starM);s.position.set(x,Math.max(h(x,z),-2)+1.5,z);s.castShadow=true;S.add(s);stars.push(s)}
let got=0;const scoreEl=document.getElementById('score');

// jogador
const pl={x:0,z:0,y:h(0,0),vy:0,yaw:0,pitch:-.1,ground:true};
const input={mx:0,mz:0,jump:false},keys={};
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);

// joystick
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let joyId=null,lookId=null,lx=0,ly=0;
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});
const endJoy=e=>{if(e.pointerId!==joyId)return;joyId=null;input.mx=input.mz=0;knob.style.transform=''};
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
function moveJoy(e){const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-70,dy=e.clientY-r.top-70;const d=Math.hypot(dx,dy),m=50;
 if(d>m){dx*=m/d;dy*=m/d}knob.style.transform=`translate(${dx}px,${dy}px)`;input.mx=dx/m;input.mz=dy/m}
// olhar
canvas.addEventListener('pointerdown',e=>{if(lookId===null){lookId=e.pointerId;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;pl.yaw-=(e.clientX-lx)*.005;pl.pitch=Math.max(-1.2,Math.min(1,pl.pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
const endLook=e=>{if(e.pointerId===lookId)lookId=null};canvas.addEventListener('pointerup',endLook);canvas.addEventListener('pointercancel',endLook);
const jb=document.getElementById('jump');jb.addEventListener('pointerdown',e=>{e.preventDefault();input.jump=true});jb.addEventListener('pointerup',()=>input.jump=false);

function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 let mx=input.mx,mz=input.mz;if(keys.KeyW)mz=-1;if(keys.KeyS)mz=1;if(keys.KeyA)mx=-1;if(keys.KeyD)mx=1;
 const sp=9,s=Math.sin(pl.yaw),c=Math.cos(pl.yaw);
 const nx=pl.x+(mx*c+mz*s)*sp*dt,nz=pl.z+(-mx*s+mz*c)*sp*dt;
 if(Math.hypot(nx,nz)<62){pl.x=nx;pl.z=nz}
 const gy=Math.max(h(pl.x,pl.z),-2.5);
 if((input.jump||keys.Space)&&pl.ground){pl.vy=9;pl.ground=false}
 pl.vy-=22*dt;pl.y+=pl.vy*dt;if(pl.y<=gy){pl.y=gy;pl.vy=0;pl.ground=true}
 cam.position.set(pl.x,pl.y+1.7,pl.z);cam.rotation.set(pl.pitch,pl.yaw,0,'YXZ');
 for(const st of stars){if(!st.visible)continue;st.rotation.y+=dt*2;st.position.y+=Math.sin(t/300+st.position.x)*.005;
  if(st.position.distanceTo(cam.position)<2.2){st.visible=false;got++;scoreEl.textContent=got===12?'🎉 Todas apanhadas!':`⭐ ${got} / 12`}}
 for(const cl of clouds){cl.position.x+=dt*1.5;if(cl.position.x>90)cl.position.x=-90}
 R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setTimeout(()=>document.getElementById('help').hidden=true,8000);
</script>
